[workspace]
resolver = "2"
members = ["tttg_forge_core", "tttg_forge_optimizer", "tttg_forge_wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rmp-serde = "1.3"
lzma-rs = "0.3"
fnv = "1.0"
thiserror = "1.0"
approx = "0.5"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
