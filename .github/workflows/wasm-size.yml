name: WASM Size

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm_size:
    name: wasm size
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build production WASM
        run: wasm-pack build tttg_forge_wasm --target web --release

      - name: Check WASM size
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          RAW_SIZE="$(wc -c < tttg_forge_wasm/pkg/tttg_forge_wasm_bg.wasm | tr -d ' ')"
          GZIP_SIZE="$(gzip -n -c tttg_forge_wasm/pkg/tttg_forge_wasm_bg.wasm | wc -c | tr -d ' ')"
          echo "{\"wasm_size\":${RAW_SIZE},\"cap\":145000,\"gzip_size\":${GZIP_SIZE},\"gzip_cap\":60000}" | tee artifacts/wasm-size.json
          if [ "$RAW_SIZE" -gt 145000 ]; then
            echo "WASM size ${RAW_SIZE} exceeds 145000 bytes"
            exit 1
          fi
          if [ "$GZIP_SIZE" -gt 60000 ]; then
            echo "WASM gzip size ${GZIP_SIZE} exceeds 60000 bytes"
            exit 1
          fi

      - name: Upload size artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size
          path: artifacts/wasm-size.json
          if-no-files-found: error
